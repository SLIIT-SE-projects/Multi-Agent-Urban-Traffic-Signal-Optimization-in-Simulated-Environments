# root/docker-compose.yml
#
# Microservices stack for the Multi-Agent Traffic Signal Optimization
# Platform.
#
# Phase 2 (current): adds the Simulation Manager service.
# Phases 3-6 will add gnn_service, mpc_service, evps_service, dashboard_api.
#
# Workflow with Docker (Phase 2):
#   1. Start SUMO on the HOST (Windows / Mac / Linux):
#        sumo-gui -c simulation_and_control_panel/scenarios/grid3x3/grid3x3.sumo.cfg \
#                 --remote-port 8813 --start
#   2. Start the stack:
#        docker compose up
#   3. Open the existing Sim Control Panel UI on http://localhost:5173
#
# Workflow without Docker (recommended for dev):
#   cd services/simulation_manager
#   python app.py            # SUMO_MODE=local — Manager spawns its own sumo-gui
version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: traffic_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  simulation_manager:
    build:
      context: ./services/simulation_manager
      dockerfile: Dockerfile
    container_name: traffic_simulation_manager
    ports:
      - "5000:5000"
    environment:
      # SUMO connection — defaults to remote because the container has no
      # SUMO binary. The host runs sumo-gui and exposes TraCI on port 8813.
      SUMO_MODE: remote
      SUMO_HOST: host.docker.internal
      SUMO_PORT: 8813
      USE_GUI: 0    # Manager doesn't show GUI; the host sumo-gui does

      # Server
      HOST: 0.0.0.0
      PORT: 5000
      DEBUG: 1

      # Simulation
      STEP_LENGTH: 1.0
      STEP_DELAY: 0.1
      AUTO_START_STEPPING: 1

      # Project root + scenarios (mirror host layout — see Dockerfile)
      PROJECT_ROOT: /workspace
      SCENARIOS_DIR: /workspace/simulation_and_control_panel/scenarios
      DEFAULT_SCENARIO: grid3x3

      # ── Model Routing (Phase 3+) ─────────────────────────────────
      # Uncomment to route a model through HTTP to its dedicated service.
      # Without it, the Manager uses its in-process adapter (Phase 2
      # behavior) — useful as a fallback if the service is unavailable.
      # MODEL_GNN_URL: http://gnn_service:8002
      # MODEL_MPC_URL: http://mpc_service:8003
      # Optional tuning:
      # MODEL_TIMEOUT_MS: 2000
      # MODEL_RESET_TIMEOUT_MS: 30000
    volumes:
      # Mirror the host repo layout inside the container at /workspace.
      # The in-process adapters in Phase 2 use `../../../services/...`
      # relative paths, so the depth must match.
      - ./services/gnn_optimizer:/workspace/services/gnn_optimizer:ro
      - ./services/mpc_traffic_control:/workspace/services/mpc_traffic_control:ro
      - ./services/emergency_vehicle_preemption:/workspace/services/emergency_vehicle_preemption:ro
      - ./model_weights:/workspace/model_weights:ro
      - ./data:/workspace/data:ro
      - ./simulation_and_control_panel/scenarios:/workspace/simulation_and_control_panel/scenarios:ro

      # Saved sim states — read-write so save/restore works
      - ./simulation_and_control_panel/backend/saved_states:/workspace/services/simulation_manager/saved_states
    extra_hosts:
      # Linux Docker doesn't auto-resolve host.docker.internal; this maps
      # it to the host gateway. No effect on Windows/Mac (they handle it
      # natively).
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      # Phase 3+: uncomment when MODEL_GNN_URL is set above so the
      # Manager waits for gnn_service to be ready before accepting
      # /api/optimizer/load requests.
      # gnn_service:
      #   condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────
  # GNN Service (Phase 3) — FastAPI wrapper around services/gnn_optimizer.
  # The Manager calls this service via http://gnn_service:8002/predict
  # when MODEL_GNN_URL is set in the simulation_manager environment above.
  # ───────────────────────────────────────────────────────────────────
  gnn_service:
    build:
      context: ./services/gnn_service
      dockerfile: Dockerfile
    container_name: traffic_gnn_service
    ports:
      - "8002:8002"
    environment:
      HOST: 0.0.0.0
      PORT: 8002
      MODEL_WEIGHTS_PATH: /workspace/model_weights/final_marl_model_best.pth
      SCENARIOS_DIR: /workspace/simulation_and_control_panel/scenarios
      MAX_INFERENCE_MS: 2000
      DECISION_INTERVAL_STEPS: 15
      MC_DROPOUT_SAMPLES: 20
    volumes:
      # Same /workspace mirroring as simulation_manager so the gnn_service
      # can import services/gnn_optimizer/src/* using its existing
      # relative-path resolution.
      - ./services/gnn_optimizer:/workspace/services/gnn_optimizer:ro
      - ./model_weights:/workspace/model_weights:ro
      - ./simulation_and_control_panel/scenarios:/workspace/simulation_and_control_panel/scenarios:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────
  # MPC Service (Phase 4) — FastAPI wrapper around services/mpc_traffic_control.
  # The Manager calls this service via http://mpc_service:8003/predict
  # when MODEL_MPC_URL is set in the simulation_manager environment above.
  # ───────────────────────────────────────────────────────────────────
  mpc_service:
    build:
      context: ./services/mpc_service
      dockerfile: Dockerfile
    container_name: traffic_mpc_service
    ports:
      - "8003:8003"
    environment:
      HOST: 0.0.0.0
      PORT: 8003
      WEIGHTS_DIR: /workspace/services/mpc_traffic_control/data
      SCENARIOS_DIR: /workspace/simulation_and_control_panel/scenarios
      MAX_INFERENCE_MS: 2000
      DECISION_INTERVAL_STEPS: 15
    volumes:
      # Same /workspace mirroring as simulation_manager so the mpc_service
      # can import services/mpc_traffic_control/src/* using its existing
      # relative-path resolution.
      - ./services/mpc_traffic_control:/workspace/services/mpc_traffic_control:ro
      - ./simulation_and_control_panel/scenarios:/workspace/simulation_and_control_panel/scenarios:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped